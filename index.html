<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>銀行內控 互動題庫</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--fg:#1d1d1f;--mut:#6b7280;--pri:#2563eb;--ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--sel:#dbeafe;--bd:#d1d5db}
@media(prefers-color-scheme:dark){:root{--bg:#111827;--card:#1f2937;--fg:#f3f4f6;--mut:#9ca3af;--pri:#3b82f6;--okbg:#14532d;--badbg:#7f1d1d;--sel:#1e3a8a;--bd:#374151}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd);z-index:5;padding:8px 12px}
header h1{font-size:18px;margin:4px 0 8px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.links{display:flex;gap:6px;margin-bottom:6px}
.links a{color:var(--pri);text-decoration:none;border:1px solid var(--bd);border-radius:10px;padding:5px 10px;font-size:15px;white-space:nowrap}
nav{display:flex;gap:6px}.tab{flex:1;padding:8px 4px}
main{max-width:760px;margin:0 auto;padding:12px 12px 40px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.on,.primary{background:var(--pri)!important;color:#fff!important;border-color:var(--pri)!important}
button:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card button{margin:4px 6px 4px 0}
.row{display:block;width:100%;text-align:left;margin-bottom:8px;border-radius:14px}
.rt{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.rt span{color:var(--mut);font-size:14px}
.pbar{height:6px;background:var(--bd);border-radius:3px;margin-top:6px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--ok)}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;margin:0}
label{display:inline-flex;align-items:center;gap:6px;margin:4px 14px 4px 0}
select{font:inherit;padding:6px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
input[type=checkbox]{width:18px;height:18px}
header.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}header.bar button{white-space:nowrap;flex:none}header.bar span{font-size:15px;color:var(--mut);text-align:center}
.meta{color:var(--mut);font-size:13px;margin-bottom:6px}
.stem{font-size:17px;margin-bottom:12px;white-space:pre-wrap;word-break:break-word}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;padding:12px;line-height:1.5;word-break:break-word;margin:0!important}
.opt.sel{background:var(--sel);border-color:var(--pri)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{opacity:1}
.exp{margin-top:12px;padding:10px 12px;border-radius:10px;border-left:4px solid}
.exp.ok{border-color:var(--ok);background:var(--okbg)}.exp.bad{border-color:var(--bad);background:var(--badbg)}
.exp p{margin:6px 0;word-break:break-word}.res{font-weight:700}.refs{color:var(--mut);font-size:13px}
.nav{display:flex;gap:8px;margin-bottom:12px}.nav button{flex:1;padding:14px}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.grid button{padding:6px 0;font-size:13px;border-radius:6px;margin:0}
.grid .done{background:var(--sel)}.grid .cur{outline:2px solid var(--pri)}.grid .ok{background:var(--okbg)}.grid .bad{background:var(--badbg)}
.center{text-align:center}.big{font-size:44px;font-weight:800;line-height:1.2}
.pass{color:var(--ok);font-weight:700}.fail{color:var(--bad);font-weight:700}
.warn{border-color:#f59e0b}
.mut{color:var(--mut);font-size:14px}
#timer{font-weight:700;font-variant-numeric:tabular-nums;color:var(--fg)}
.fav{font-size:20px;padding:4px 12px;color:#f59e0b}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:6px 4px;text-align:left}
</style>
</head>
<body>
<div id="app"></div>
<script>
const DATA = {"hot":[{"id":"L-001","s":"law","ch":"法規 1｜銀行業務相關規範","star":2,"n":4,"refs":"49-38、44-36、41-36、37-36","stem":"依主管機關規定，金融機構不得與客戶概括授權將活期存款轉入下列何者存款帳戶？","opts":["同一金融機構之活期存款","同一金融機構之定期存款","同一金融機構之支票存款","其他金融機構之活期存款"],"ans":3,"exp":["見筆記 法規 1｜銀行業務相關規範"]},{"id":"L-002","s":"law","ch":"法規 1｜銀行業務相關規範","star":2,"n":4,"refs":"42-36、38-36、33-36、29-32","stem":"有關活期存款依約定方式提取存款之規範，下列敘述何者正確？","opts":["金融機構不得與客戶約定由金融機構將活期存款轉入其他金融機構之帳戶","金融機構不得與客戶約定由金融機構將活期存款轉入同一金融機構之帳戶","客戶可概括授權金融機構將活期存款轉入支票存款帳戶","金融機構依約定辦理轉帳後，應寄發對帳通知"],"ans":4,"exp":["💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡","🔗 相關考點 L-003：依銀行法第七條有關活期存款依約定方式提取存款之規範規定，金融機構得與客戶約定之轉帳方式，下… → 錯的是「不得將活期存款轉入其他金融機構之活期存款帳戶」","見筆記 法規 1｜銀行業務相關規範"]},{"id":"L-003","s":"law","ch":"法規 1｜銀行業務相關規範","star":1,"n":3,"refs":"47-37、39-35、36-35","stem":"依銀行法第七條有關活期存款依約定方式提取存款之規範規定，金融機構得與客戶約定之轉帳方式，下列敘述何者錯誤？","opts":["金融機構依約定轉入後，應寄發對帳通知","得將活期存款轉入同一金融機構之活期存款帳戶","不得將活期存款轉入其他金融機構之活期存款帳戶","不得有概括授權將活期存款轉入支票存款帳戶之情事"],"ans":3,"exp":["💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","🔗 相關考點 L-002：有關活期存款依約定方式提取存款之規範，下列敘述何者正確？… → 答案「金融機構依約定辦理轉帳後，應寄發對帳通知」","見筆記 法規 1｜銀行業務相關規範"]},{"id":"L-004","s":"law","ch":"法規 1｜銀行業務相關規範","star":1,"n":3,"refs":"46-28、37-25、33-25","stem":"凡提領外匯存款兌換為新臺幣，金額達新臺幣五十萬元以上者，應請客戶填寫下列何種書表？","opts":["結購外匯","毋須填寫","大額結匯資料表","外匯收支或交易申報書"],"ans":4,"exp":["見筆記 法規 1｜銀行業務相關規範"]},{"id":"L-005","s":"law","ch":"法規 1｜銀行業務相關規範","star":1,"n":3,"refs":"45-3、34-3、32-1","stem":"依銀行法規定，銀行對於無自用住宅者購買自用住宅之放款，最長期限不得超過多久？","opts":["十五年","二十年","三十年","無期限限制"],"ans":4,"exp":["🔗 相關考點 L-015：依銀行法規定，銀行對購買或建造住宅或企業用建築，得辦理中、長期放款，除對於無自用住宅者購買… → 答案「三十年」","見筆記 法規 1｜銀行業務相關規範"]},{"id":"L-006","s":"law","ch":"法規 1｜銀行業務相關規範","star":1,"n":3,"refs":"40-36、36-36、29-33","stem":"金融機構遇有存戶未及時領回存摺，於立即設簿登記後，應採取之處理方式，下列何者不恰當？","opts":["由經辦人員妥慎保管","儘速發函通知客戶洽領","儘速以電話通知客戶洽領","送交指定主管人員集中保管"],"ans":1,"exp":["💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","🔗 相關考點 L-014：金融機構遇有存戶未及時領回存摺時，下列措施何者錯誤？… → 錯的是「予以銷燬」","見筆記 法規 1｜銀行業務相關規範"]},{"id":"L-007","s":"law","ch":"法規 1｜銀行業務相關規範","star":1,"n":2,"refs":"48-4、37-1", :"信用合作社對大額授信擔保物之鑑價，應如何辦理？","opts":["應明定鑑估之層級","應由放款經辦員辦理鑑估","應按買賣契約價七成鑑估","應由放款主管認定時價，再交由鑑價經辦員辦理鑑估"],"ans":1,"exp":["見筆記 法規 4｜徵信與授信相關規章"]},{"id":"L-111","s":"law","ch":"法規 4｜徵信與授信相關規章","star":1,"n":2,"refs":"40-37、36-39","stem":"為建立防杜辦理分散借款集中使用案件之作業機制及建立大額授信之鑑估制度，下列何者非屬金融機構於其徵信或授信審核內部規定中應明定事項？","opts":["同一所有權人之擔保物，由數人分別辦理授信時，應提出親屬或股東或合夥關係之證明","對大額授信之擔保物之鑑價，應明定鑑估之層級","對一定金額以上之擔保物鑑價，應由授審會負責辦理","對一定金額以上之授信擔保物，應洽借款戶徵提經第三公正人鑑估之報告為佐證資料"],"ans":3,"exp":["💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","見筆記 法規 4｜徵信與授信相關規章"]},{"id":"L-112","s":"law","ch":"法規 4｜徵信與授信相關規章","star":1,"n":2,"refs":"39-49、25-24","stem":"金融控股公司之銀行子公司對金融控股公司法第 44 條所規範之利害關係人為擔保授信，該擔保授信總餘額不得超過該子公司淨值（業主權益）之多少？","opts":["1 倍","1.5 倍","2 倍","2.5 倍"],"ans":2,"exp":["見筆記 法規 4｜徵信與授信相關規章"]},{"id":"L-113","s":"law","ch":"法規 4｜徵信與授信相關規章","star":1,"n":2,"refs":"37-3、25-4","stem":"甲為某商業銀行之總經理，下列甲之親屬中，除消費者貸款外，該商業銀行得對何者辦理無擔保授信？","opts":["甲之侄兒","甲之堂兄","甲之父","甲之孫"],"ans":2,"exp":["見筆記 法規 4｜徵信與授信相關規章"]},{"id":"L-114","s":"law","ch":"法規 4｜徵信與授信相關規章","star":1,"n":2,"refs":"36-47、26-48","stem":"有關金融機構辦理國內信用狀融資業務之作業規範，下列敘述何者錯誤？","opts":["須評估融資必要性","須確認具有實質交易行為","須核實匡計借款戶所需額度","不得以借款戶之關係企業為受益人"],"ans":4,"exp":["💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","見筆記 法規 4｜徵信與授信相關規章"]},{"id":"L-115","s":"law","ch":"法規 4｜徵信與授信相關規章","star":1,"n":2,"refs":"34-14、30-16","stem":"依「銀行資產評估損失準備提列及逾期放款催收款呆帳處理辦法」規定，短期放款逾期經協議分期償還符合下列何者，並依協議條件履行達六個月以上，且協議利率不低於原承作利率或新承作同類風險放款利率者，得免列報逾期放款？","opts":["每年償還本息在百分之五以上為原則，惟期限最長為十年","每年償還本息在百分之十以上為原則，惟期限最長為二十年","每年償還本息在百分之十以上為原則，惟期限最長為五年","每年償還本息在百分之三十以上為原則，惟期限最長為二十年"],"ans":3,"exp":["見筆記 法規 4｜徵信與授信相關規章"]},{"id":"L-116","s":"law","ch":"法規 4｜徵信與授信相關規章","star":1,"n":2,"refs":"30-24、25-41","stem":"依「中華民國銀行公會會員徵信準則」規定，企業中長期總授信金額至少達新台幣多少元者，應加送現金流量預估表及預估資產負債表等資料？","opts":["一億元","二億元","三億元","四億元"],"ans":2,"exp":["🔗 相關考點 L-101：依「中華民國銀行公會會員徵信準則」規定，企業授信戶總授信金額至少達新臺幣（以下同）若干金額… → 答案「三千萬元」","見筆記 法規 4｜徵信與授信相關規章"]},{"id":"L-117","s":"law","ch":"法規 4｜徵信與授信相關規章","star":1,"n":2,"refs":"29-48、25-22","stem":"銀行對銀行法第 33 條所規範之利害關係人辦理 xp":["見筆記 法規 2｜信用卡、現金卡業務"]},{"id":"49法規-42","s":"law","stem":"警察機關因偵辦刑事案件需要，行文查詢與該案有關金融機構客戶之存放款資料，下列敘述何者正確？","opts":["金融機構先提供資料再陳報主管機關","由規定層級以上人員核准，逕行行文金融機構，毋需報主管機關核准","報請主管機關核准後，金融機構再提供資料","報請銀行公會核准後，金融機構再提供資料"],"ans":2,"exp":["同高頻題 L-173（出現 5 屆）","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡","🔗 相關考點 L-198：警察機關因偵辦刑事案件需要，註明案由，向金融機構查詢有關客戶之存放款資料，下列敘述何者正確… → 答案「原則上須經由警察局局長（副局長）或警察總隊總隊長（副總隊長）判行」","見筆記 法規 7｜歹徒詐騙與防制"]},{"id":"49法規-43","s":"law","stem":"依主管機關規定，金融機構為發還滯留於「警示帳戶」內剩餘款項，應依開戶資料聯絡開戶人，與其協商發還「警示帳戶」內剩餘款項事宜；如經通知無法聯絡者，應洽請警方協尋多久？","opts":["半個月","一個月","二個月","三個月"],"ans":2,"exp":["同高頻題 L-174（出現 5 屆）","🔗 相關考點 L-182：依主管機關規定，金融機構為發還滯留於「警示帳戶」內剩餘款項，應指定一何職級之人員專責督導發… → 答案「副總經理」","見筆記 法規 7｜歹徒詐騙與防制"]},{"id":"49法規-44","s":"law","stem":"為確保資料之即時性，金融聯合徵信中心接獲通報「警示帳戶」資料，應多久之內將資料轉入「信用資料庫」？","opts":["每半小時","每一小時","每二小時","每三小時"],"ans":1,"exp":["同高頻題 L-178（出現 3 屆）","見筆記 法規 7｜歹徒詐騙與防制"]},{"id":"49法規-45","s":"law","stem":"金融機構應於通報重大偶發事件之次日起，幾個營業日內函報詳細資料或後續處理情形？","opts":["三","五","七","十"],"ans":3,"exp":["🔗 相關考點 L-140：依主管機關規定，金融機構發生重大偶發事件之次日起，應於何時向主管機關函報詳細資料或後續處理… → 答案「七個營業日」","🔗 相關考點 L-161：依「銀行稽核工作考核要點」規定，各金融機構對重大偶發事件，應於下列何期限內將詳細資料或後續… → 答案「一週內」","見筆記 法規 6｜銀行安全管理"]},{"id":"49法規-46","s":"law","stem":"下列何者應計入銀行法第 33 條第 2 項規定之授信總餘額？","opts":["對政府機關之授信","以公司債為擔保品之授信","對公營事業之授信","配合政府政策經中央銀行專案轉融通之授信"],"ans":2,"exp":["同高頻題 L-082（出現 3 屆）","🔗 相關考點 L-100：依主管機關規定，下列何者應計入銀行法第 33 條規定之授信限額及授信總餘額內？… → 答案「以非屬授信銀行之存單為擔保品之授信」","🔗 相關考點 L-083：下列何者非屬銀行法第 33 條第 2 項所規定之「授信條件」？… → 錯的是「匯率」","見筆記 法規 4｜徵信與授信相關規章"]},{"id":"49法規-47","s":"law","stem":"依銀行法第 32 條第 1 項規定，銀行不得對其辦理授信之職員有利害關係者為無擔保授信，但消費者貸款及對政府貸款不在此限。所稱「消費者貸款額度」，主管機關規定合計以每一消費者不超過新臺幣多少元為限？","opts":["100 萬元","200 萬元","300 萬元","400 萬元"],"ans":2,"exp":["見筆記 法規 4｜徵信與授信相關規章"]},{"id":"49法規-48","s":"law","stem":"依銀行法第 32 條第 3 項主要股東之定義，其所稱之股份係指下列何者？","opts":["普通股","黃金股","無表決權之特別股","普通股及有表決權之特別股"],"ans":4,"exp":["見筆記 法規 4｜徵信與授信相關規章"]},{"id":"49法規-49","s":"law","stem":"有關銀行法第 12 條之 1 所稱「自用住宅放款」之條件，下列敘述何者錯誤？","opts":["申請人為中華民國國民或外國人皆可","申請人目前確無自用住宅","申請人係為購置自住使用之住宅","申請人應具有完全行為能力"],"ans":1,"exp":["💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","🔗 相關考點 L-099：有關銀行法第 12 條之 1 第 2 項規定之「足額擔保」，下列敘述何者錯誤？… → 錯的是「足額擔保與否，悉依委外鑑估之評價結果為準」","見筆記 法規 4｜徵信與授信相關規章"]},{"id":"49法規-50","s":"law","stem":"有關金融機構出售不良債權時，下列何者得參與議價或投標？","opts":["出售標的之借款人","擔保物提供人","出售標的之保證人","一般資產管理公司"],"ans":4,"exp":["同高頻題 L-121（出現 3 屆）","🔗 相關考點 L-129：下列何者非屬「金融機構出售不良債權應注意事項」之適用對象？… → 錯的是「郵局」","🔗 相關考點 L-119：金融機構出售不良債權，下列何者非屬其標售公告應揭露之事項？… → 錯的是「出售標的如含現金卡及信用卡債權時，應公告持卡人之信用資料」","見筆記 法規 5｜委外作業與出售不良債權"]}]},{"id":"48法規","name":"第 48 屆 法規","s":"law","min":60,"items":[{"id":"48法規-01","s":"law","stem":"依「金融控股公司法」規定，下列何者與甲非同一關係人？","opts":["甲之配偶乙","甲擔任董事長的 A 公司","甲之舅舅丙","由甲之配偶乙擔任董事長之 B 公司"],"ans":3,"exp":["見筆記 法規 4｜徵信與授信相關規章"]},{"id":"48法規-02","s":"law","stem":"依銀行法所稱之「授信」，不包括下列何種業務？","opts":["放款","透支","保證","證券經紀"],"ans":4,"exp":["同高頻題 L-079（出現 4 屆）","💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","見筆記 法規 4｜徵信與授信相關規章"]},{"id":"48法規-03","s":"law","stem":"依「金融控股公司法」規定，下列何者不屬於該法之金融機構？","opts":["經營證券金融業務之證券金融公司","依保險法以股份有限公司組織設立之保險業","票券金融公司","農漁會信用部"],"ans":4,"exp":["同高頻題 L-209（出現 4 屆）","💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","見筆記 法規 8｜內部控制及稽核制度"]},{"id":"48法規-04","s":"law","stem":"依銀行法規定，因自用住宅放款及消費性放款而徵取之保證人，其保證契約自成立之日起，有效期間不得逾多久？（但經保證人書面同意者，不在此限）","opts":["五年","十年","十五年","二十年"],"ans":3,"exp":["同高頻題 L-007（出現 2 屆）","見筆記 法規 1｜銀行業務相關規範"]},{"id":"48法規-05","s":"law","stem":"依銀行法規定，商業銀行投資每一非金融相關事業金額不得超過該被投資事業實收資本總額或已發行股份總數之百分之多少？","opts":["五","十","十五","二十"],"ans":1,"exp":["🔗 相關考點 L-237：依銀行法規定，商業銀行投資非金融相關事業之總額不得超過投資時淨值之百分之多少？… → 答案「十」","見筆記 法規 8｜內部控制及稽核制度"]},{"id":"48法規-06","s":"law","stem":"依「金融控股公司及銀行業內部控制及稽核制度實施辦法」規定，內部稽核報告及其工作底稿應至少留存幾年備查？","opts":["一年","二年","三年","五年"],"ans":4,"exp":["同高頻題 L-215（出現 3 屆）","🔗 相關考點 L-207：依「金融控股公司及銀行業內部控制及稽核制度實施辦法」規定，銀行內部稽核單位應隸屬於下列何者… → 答案「董（理）事會」","🔗 相關考點 L-256：依「金融控股公司及銀行業內部控制及稽核制度實施辦法」規定，內部稽核單位實施查核之頻次，下列… → 答案「對國內管理單位每年至少一次專案查核」","見筆記 法規 8｜內部控制及稽核制度"]},{"id":"48法規-07","s":"law","stem":"依「金融控股公司及銀行業內部控制及稽核制度實施辦法」規定，會計師辦理銀行業內部控制制度之查核，不需對下列何者表示意見？","opts":["備抵呆帳提列政策之妥適性","營運或專案計畫目標之達成情形", 及銀行業內部控制及稽核制度實施辦法」規定，下列何者不符合銀行業內部稽核人員… → 錯的是「具有國際內部稽核師考試及格證書」","🔗 相關考點 L-207：依「金融控股公司及銀行業內部控制及稽核制度實施辦法」規定，銀行內部稽核單位應隸屬於下列何者… → 答案「董（理）事會」","見筆記 法規 8｜內部控制及稽核制度"]},{"id":"47法規-08","s":"law","stem":"依「金融控股公司及銀行業內部控制及稽核制度實施辦法」規定，主管機關若發現銀行委託之會計師有未足以勝任委託查核工作之情事者，得採取下列何種措施？","opts":["令銀行於次年度更換會計師辦理查核工作","令銀行更換委託查核之會計師重新辦理查核工作","由主管機關指派會計師重新辦理查核工作","交付會計師懲戒委員會處理"],"ans":2,"exp":["同高頻題 L-219（出現 3 屆）","🔗 相關考點 L-240：依「金融控股公司及銀行業內部控制及稽核制度實施辦法」規定，會計師辦理銀行年度財務報表查核簽… → 答案「受查銀行資產不足以抵償負債或財務狀況顯著惡化」","🔗 相關考點 L-233：依「金融控股公司及銀行業內部控制及稽核制度實施辦法」規定，會計師辦理銀行業內部控制制度之查… → 答案「營運或專案計畫目標之達成情形」","見筆記 法規 8｜內部控制及稽核制度"]},{"id":"47法規-09","s":"law","stem":"依「金融控股公司及銀行業內部控制及稽核制度實施辦法」規定，在銀行自行查核制度中，下列何項不符規定？","opts":["各銀行資訊單位應每月至少辦理一次專案自行查核","各銀行財務單位應每年至少辦理一次一般自行查核","各銀行營業單位應每月至少辦理一次專案自行查核","各銀行資產保管單位應每半年至少辦理一次一般自行查核"],"ans":2,"exp":["💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","🔗 相關考點 L-245：依「金融控股公司及銀行業內部控制及稽核制度實施辦法」規定，有關自行查核之實施方式，下列敘述… → 錯的是「由銀行內部稽核單位負責自行查核作業」","🔗 相關考點 L-207：依「金融控股公司及銀行業內部控制及稽核制度實施辦法」規定，銀行內部稽核單位應隸屬於下列何者… → 答案「董（理）事會」","見筆記 法規 8｜內部控制及稽核制度"]},{"id":"47法規-10","s":"law","stem":"依「金融控股公司及銀行業內部控制及稽核制度實施辦法」規定，下列何者不符合銀行業內部稽核人員應具備條件之規定？","opts":["具有國際內部稽核師考試及格證書","具有二年以上之金融檢查經驗","具有五年以上之金融業務經驗","曾任會計師事務所查帳員二年以上，並經施以三個月以上之金融業務及管理訓練"],"ans":1,"exp":["同高頻題 L-218（出現 3 屆）","💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","🔗 相關考點 L-207：依「金融控股公司及銀行業內部控制及稽核制度實施辦法」規定，銀行內部稽核單位應隸屬於下列何者… → 答案「董（理）事會」","🔗 相關考點 L-236：依「金融控股公司及銀行業內部控制及稽核制度實施辦法」規定，銀行內部稽核人員應具備條件之一為… → 答案「三年」","見筆記 法規 8｜內部控制及稽核制度"]},{"id":"47法規-11","s":"law","stem":"依「銀行業公司治理實務守則」規定，已選任獨立董事之銀行業，除經主管機關核准者外，應提董事會決議通過；獨立董事如有反對意見，應於董事會議事錄載明之事項，下列何者非屬之？","opts":["重大之資產或衍生性商品交易","涉及董事或監察人自身利害關係之事項","簽證會計師之委任、解任或報酬","內部控制有效性之考核"],"ans":4,"exp":["同高頻題 L-235（出現 2 屆）","💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","🔗 相關考點 L-242：依「銀行業公司治理實務守則」規定，下列何者非屬銀行業應提董事會討論之事項？… → 錯的是「內部稽核人員之任免」","見筆記 法規 8｜內部控制及稽核制度"]},{"id":"47法規-12","s":"law","stem":"金融機構辦理出租保管箱業務，有關放置保管箱處所及應裝設錄影監視系統，下列敘述何者錯誤？","opts":["出租保管箱業務原則上於租用之行舍辦理","營業時間外，應可藉由保管箱室外之監視器上觀察保管箱室內部動靜","隱密型攝影機及攝影光源之啟動開關、監視器應設於保管箱室外隱密處","保管箱室內除為保護客戶隱私之區域（如整理室）外，應裝設能涵蓋各角落之錄影監視系統"],"ans":1,"exp":["💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","🔗 相關考點 L-134：金融機構辦理出租保管箱業務，放置保管箱處所應於何時裝置定時密碼鎖？… → 答案「營業時間外」","見筆記 法規 6｜銀行安全管理"]},{"id":"47法規-13","s":"law","stem":"依「銀行資產評估損失準備提列及逾期放款催收款呆帳處理辦法」規定，有關逾期放款及催收款之轉銷，下列敘述何者正確？","opts":["應經監察人同意，並通知董（理）事會","逾清償期在六個月以上二年以下者，應立即轉銷為呆帳","外國銀行在台分行轉銷前，須事先呈報本國主管機關核准","提列之備抵呆帳或保證責任準備不足時，得認列為當年度損失"],"ans":4,"exp":["💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡","🔗 相關考點 L-108：依「銀行資產評估損失準備提列及逾期放款催收款呆帳處理辦法」規定，銀行逾期放款及催收款應積極… → 答案「專案報經常務董（理）事會核准後辦理」","🔗 相關考點 L-115：依「銀行資產評估損失準備提列及逾期放款催收款呆帳處理辦法」規定，短期放款逾期經協議分期償還… → 答案「每年償還本息在百分之十以上為原則，惟期限最長為五年」","見筆記 法規 4｜徵信與授信相關規章"]},{"id":"47法規-14","s":"law","stem":"依主管機關規定，金融機構自動櫃員機(ATM)及週遭監視之錄影帶應暫行保存幾個月以上，錄影帶內容有涉及交易糾紛或民刑事案件者，於案件未結前，並應繼續保存？","opts":["三個月","六個月","九個月","十二個月"],"ans":2,"exp":["見筆記 法規 6｜銀行安全管理"]},{"id":"47法規-15","s":"law","stem":"依「金融機構辦理電子銀行業務安全控管作業基準」規定，運用自動櫃員機(CD/ATM)處理卡片交易時，卡片內含錄碼及資料中，下列何者不得儲存於自動櫃員機內？","opts":["交易序號","有效期限","使用者代號","帳號／卡號"],"ans":3,"exp":["同高頻題 L-149（出現 2 屆）","💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","🔗 相關考點 L-148：依「金融機構辦理電子銀行業務安全控管作業基準」規定，電子銀行業務之訊息傳輸途徑不包括下列何… → 錯的是「內部網路」","見筆記 法規 6｜銀行安全管理"]},{"id":"47法規-16","s":"law","stem":"有關「金融機構作業委託他人處理內部作業制度及程序辦法」之適用金融機構，不包括下列何者？","opts":["本國銀行","信用合作社","證券公司","經營信用卡業務之機構"],"ans":3,"exp":["💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","🔗 相關考點 L-122：依「金融機構作業委託他人處理內部作業制度及程序辦法」規定，金融機構作業委外事項，不包括下列… → 錯的是「委託其財務簽證會計師辦理內部稽核作業」","🔗 相關考點 L-124：下列何者非屬「金融機構作業委託他人處理內部作業制度及程序辦法」所規定之委外作業事項？… → 錯的是「授信審核之准駁」","見筆記 法規 5｜委外作業與出售不良債權"]},{"id":"47法規-17","s":"law","stem":"為防範人頭帳戶從事犯罪，銀行於受理客戶開立存款戶時，應查核客戶身分，其作業流程，下列敘述何者正確？","opts":["由經辦員憑經驗核對身分證明文件即可","請客戶依規定填寫申請書並附上身分證影本即可開戶","除核對身分證相片與客戶是否相符外，另要求提供工作等相關證件","確認客戶身分，並利用內政部戶役政網站查詢，以確定該身分證是否為遺失或被竊"],"ans":4,"exp":["💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡","見筆記 法規 1｜銀行業務相關規範"]},{"id":"47法規-18","s":"law","stem":"下列何者非屬「金融同業間遭歹徒詐騙案件通報要點」所稱詐騙案件？","opts":["偽造票據案件","偽變造信用卡案件","授信詐騙案件","火災、天災等重大偶發案件"],"ans":4,"exp":["💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","🔗 相關考點 L-196：下列何者非屬「金融同業間遭歹徒詐騙案件通報要點」所稱之詐騙？… → 錯的是「擠兌存款事件」","🔗 相關考點 L-187：依「金融同業間遭歹徒詐騙案件通報要點」規定，下列敘述何者錯誤？… → 錯的是「各金融機構所屬分支機構如發現歹徒詐騙情事時，應立即通報經濟犯罪防制中心」","見筆記 法規 7｜歹徒詐騙與防制"]},{"id":"47法規-19","s":"law","stem":"依「金融同業間遭歹徒詐騙案件通報要點」規定，通報作業判斷方式，下列何者程序正確？","opts":["金融機構所屬分支機構發現詐騙情事得逞者才通報，未得逞不通報","其得逞者立即通報經濟犯罪防制中心","無論是否得逞均立即通報經濟犯罪防制中心","無論是否得逞均立即通報所屬總管理機構"],"ans":4,"exp":["同高頻題 L-190（出現 2 屆）","💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡","🔗 相關考點 L-187：依「金融同業間遭歹徒詐騙案件通報要點」規定，下列敘述何者錯誤？… → 錯的是「各金融機構所屬分支機構如發現歹徒詐騙情事時，應立即通報經濟犯罪防制中心」","🔗 相關考點 L-177：依「金融同業間遭歹徒詐騙案件通報要點」規定，通報系統分為幾部分通報圈？… → 答案「各金融機構與聯合徵信中心之通報圈與各金融機構總管理機構與其所屬分支機構之內部通報圈」","見筆記 法規 7｜歹徒詐騙與防制"]},{"id":"47法規-20","s":"law","stem":"依「金融同業間遭歹徒詐騙案件通報要點」規定，金融機構所屬分支機構如發現遭歹徒詐騙情事時，應立即循內部通報系統向金融聯合徵信中心通報。有關通報方式之規定，下列敘述何者正確？","opts":["會員機構以書面方式通報；非會員之機構以電話通報","會員機構以電話通報；非會員之機構以書面方式通報","會員機構以網際網路方式通報；非會員之機構以書面方式通報","不論會員機構或非會員之機構，一律以網際網路方式通報"],"ans":3,"exp":["💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡","🔗 相關考點 L-179：依「金融同業間遭歹徒詐騙案件通報要點」規定，非金融聯合徵信中心會員之金融機構，對詐騙案件應… → 答案「傳真」","🔗 相關考點 L-187：依「金融同業間遭歹徒詐騙案件通報要點」規定，下列敘述何者錯誤？… → 錯的是「各金融機構所屬分支機構如發現歹徒詐騙情事時，應立即通報經濟犯罪防制中心」","見筆記 法規 7｜歹徒詐騙與防制"]},{"id":"47法規-21","s":"law","stem":"依「信用卡業務機構管理辦法」規定，發卡機構於持卡人收到所申請信用卡之日起，多少日內經持卡人通知解除契約，且尚未開卡使用者，不得向該持卡人請求負擔任何費用？","opts":["七日","十四日","二十一日","三十日"],"ans":1,"exp":["同高頻題 L-027（出現 3 屆）","⚠ 第 45 屆問法或選項不同，當時答案是「七天」→ 看清楚題目問什麼","見筆記 法規 2｜信用卡、現金卡業務"]},{"id":"47法規-22","s":"law","stem":"依「中華民國銀行公會信用卡業務委員會所屬機構辦理信用卡業務自律公約」規定，信用卡發卡機構應注意遵守下列哪一機構對於贈品贈獎促銷額度案件之相關處理原則？","opts":["消費者保護協會","公平交易委員會","經濟部標準檢驗局","財政部"],"ans":2,"exp":["同高頻題 L-037（出現 2 屆）","見筆記 法規 2｜信用卡、現金卡業務"]},{"id":"47法規-23","s":"law","stem":"匯款人以新臺幣結購辦理匯出匯款，結購金額未達新臺幣多少元時，免填寫「外匯收支或交易申報書」？","opts":["50 萬元","100 萬元","150 萬元","200 萬元"],"ans":1,"exp":["見筆記 法規 1｜銀行業務相關規範"]},{"id":"47法規-24","s":"law","stem":"指定銀行於輔導申報人填寫外匯收支或交易申報書之敘述，下列何者錯誤？","opts":["申請人不識字，銀行可代為填寫，惟仍需申報義務人簽名或蓋章","申報義務人結匯性質，與其結匯金額有違常情或與其身分業別不符時，要求申報義務人據實申報，再予受理","申請書之金額及結匯性質填寫錯誤，要求申報人於更改處簽名蓋章","要求申報義務人將結匯性質、匯款（受款）地區國別、證件號碼、地址及電話等填列完整"],"ans":3,"exp":["💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","見筆記 法規 1｜銀行業務相關規範"]},{"id":"47法規-25","s":"law","stem":"依「中華民國銀行公會會員徵信準則」規定，下列何種授信得自該準則所稱「總授信金額」中扣除？","opts":["貼現","透支","墊付國內應收帳款","出口押匯"],"ans":4,"exp":["同高頻題 L-096（出現 2 屆）","🔗 相關考點 L-084：有關「中華民國銀行公會會員徵信準則」各條款所稱之「總授信金額」，下列敘述何者正確？… → 答案「係指金融聯合徵信中心歸戶餘額加計本次申貸金額」","🔗 相關考點 L-081：依「中華民國銀行公會會員徵信準則」規定，中小企業總授信金額最多在新臺幣幾百萬元以下，其徵信… → 答案「六百萬元」","見筆記 法規 4｜徵信與授信相關規章"]},{"id":"47法規-26","s":"law","stem":"銀行辦理無追索權之應收帳款承購業務，其由應收帳款承購商或保險公司保證者，因買方之原因造成逾期，應於何時將何者之資料填報聯徵中心以供會員機構查詢？","opts":["帳款逾期三個月；買方","帳款逾期六個月；賣方","承購商或保險公司確定不理賠之日起三個月內；買方","承購商或保險公司確定不理賠之日起六個月內；賣方"],"ans":3,"exp":["見筆記 法規 4｜徵信與授信相關規章"]},{"id":"47法規-27","s":"law","stem":"王小明為大大銀行之負責人，下列何者非屬大大銀行可投資之有價證券？","opts":["由王小明擔任董事之 A 股份有限公司發行之股票","B 股份有限公司發行並經其他銀行保證之公司債","乙銀行發行之可轉讓定期存單","金融債券"],"ans":1,"exp":["💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","見筆記 法規 3｜票券證券、空白單據與保管"]},{"id":"47法規-28","s":"law","stem":"有關銀行辦理結構型商品之敘述，下列何者錯誤？","opts":["結構型商品係結合固定收益商品與衍生性金融商品","銀行應向客戶充分揭露並明確告知可能涉及之風險，其中風險包含最大損失金額","所有商品之報價資料均不得於銀行網站上揭露","客戶得就其交易請銀行提供提前解約之報價資訊"],"ans":3,"exp":["💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","見筆記 法規 2｜信用卡、現金卡業務"]},{"id":"47法規-29","s":"law","stem":"依「票券金融管理法」規定，票券商業務人員須向下列何者登記，否則不得執行職務？","opts":["證期會","金管會","證券商同業公會","票券金融商業同業公會"],"ans":4,"exp":["同高頻題 L-057（出現 3 屆）","見筆記 法規 3｜票券證券、空白單據與保管"]},{"id":"47法規-30","s":"law","stem":"票券商辦理非公司組織之公營事業機構何項業務時，不須辦理徵信調查？","opts":["承銷之本票經其他金融機構保證者","對該機構發行本票之承銷","對該機構發行本票之保證","對該機構發行本票之背書"],"ans":1,"exp":["見筆記 法規 3｜票券證券、空白單據與保管"]},{"id":"47法規-31","s":"law","stem":"依規定，短期票券集中保管機構對參加人之帳簿與其送存及交割之憑證，應自登載日起，至少保存幾年？","opts":["一年","二年","三年","五年"],"ans":4,"exp":["同高頻題 L-064（出現 2 屆）","見筆記 法規 3｜票券證券、空白單據與保管"]},{"id":"47法規-32","s":"law","stem":"依金融消費者保護法規定，金融消費者不接受金融服務業對爭議處理結果，得於收受處理結果之日起幾日內，向爭議處理機構申請評議？","opts":["三十","六十","九十","一百二十"],"ans":2,"exp":["見筆記 法規 2｜信用卡、現金卡業務"]},{"id":"47法規-33","s":"law","stem":"金融服務業從事廣告、業務招攬及營業促銷活動，不得有之情事，不包括下列何者？","opts":["違反自律規範","使用金融服務業自己之註冊商標","損害金融服務業信譽","虛偽不實"],"ans":2,"exp":["💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","見筆記 法規 2｜信用卡、現金卡業務"]},{"id":"47法規-34","s":"law","stem":"銀行業提供投資型金融商品，於訂立契約前，應充分瞭解金融消費者之相關資料，其中「瞭解金融消費者審查原則」規定，應留存之基本資料，不包括下列何者？","opts":["身分","家人背景","風險偏好","過往投資經驗"],"ans":2,"exp":["💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","見筆記 法規 2｜信用卡、現金卡業務"]},{"id":"47法規-35","s":"law","stem":"金融服務業提供之金融商品屬複雜性高風險商品者，依規定錄音或錄影內容至少應保存多久期間？","opts":["該商品存續期間","該商品存續期間加計一個月","該商品存續期間加計二個月","該商品存續期間加計三個月"],"ans":4,"exp":["見筆記 法規 2｜信用卡、現金卡業務"]},{"id":"47法規-36","s":"law","stem":"依國際清算銀行巴賽爾監理委員會所訂「內部控制制度評估原則」，下列何者應維持權責劃分、報告系統明確之組織架構及確保授權辦法得以有效執行？","opts":["高階管理階層","董事會","稽核委員會","董事長"],"ans":1,"exp":["同高頻題 L-220（出現 3 屆）","🔗 相關考點 L-229：依國際清算銀行巴塞爾監理委員會所訂「內部控制制度評估原則」，下列何者不符合有效的內部控制制… → 錯的是「指派員工擔任有利益衝突或互為牽制之工作」","🔗 相關考點 L-210：依國際清算銀行巴塞爾監理委員會所訂內部控制制度評估原則之規定，有效的內部控制制度必須有適當… → 答案「不指派員工擔任有利益衝突或互為牽制之工作」","見筆記 法規 8｜內部控制及稽核制度"]},{"id":"47法規-37","s":"law","stem":"依銀行法第七條有關活期存款依約定方式提取存款之規範規定，金融機構得與客戶約定之轉帳方式，下列敘述何者錯誤？","opts":["金融機構依約定轉入後，應寄發對帳通知","得將活期存款轉入同一金融機構之活期存款帳戶","不得將活期存款轉入其他金融機構之活期存款帳戶","不得有概括授權將活期存款轉入支票存款帳戶之情事"],"ans":3,"exp":["同高頻題 L-003（出現 3 屆）","💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","🔗 相關考點 L-002：有關活期存款依約定方式提取存款之規範，下列敘述何者正確？… → 答案「金融機構依約定辦理轉帳後，應寄發對帳通知」","見筆記 法規 1｜銀行業務相關規範"]},{"id":"47法規-38","s":"law","stem":"有關銀行業應由總機構指定單位負責檢舉案件之受理及調查，下列敘述何者錯誤？","opts":["可指定法令遵循單位辦理","可指定內部稽核單位辦理","可指定政風單位辦理","若案件性質較特殊複雜或內部無適宜人員可擔任調查工作者，仍不可委由外部專業獨立單位辦理"],"ans":4,"exp":["💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","見筆記 法規 6｜銀行安全管理"]},{"id":"47法規-39","s":"law","stem":"依規定，信用卡發卡機構辦理發卡業務時，有關得於申請書上另行附加勾選其他非經客戶同意申請之卡片，下列敘述何者正確？","opts":["只有所屬職員可以","只有委外行銷推廣人員可以","所屬職員及委外行銷推廣人員都可以","所屬職員及委外行銷推廣人員都不可以"],"ans":4,"exp":["💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡","見筆記 法規 2｜信用卡、現金卡業務"]},{"id":"47法規-40","s":"law","stem":"有關銀行對理專之人事管理制度，下列敘述何者錯誤？","opts":["任用新進理專，應採行盡職調查程序","對於現職理專應定期或不定期瞭解其信用及財務狀況","理專不得代客保管存摺","理專經報備後可以保管已簽章空白交易單據"],"ans":4,"exp":["💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","🔗 相關考點 L-251：有關強化銀行內部控制制度之措施，下列敘述何者錯誤？… → 錯的是「加強對員工各項體能之訓練」","見筆記 法規 8｜內部控制及稽核制度"]},{"id":"47法規-41","s":"law","stem":"信用卡每期最低應繳金額至少應包含之項目，下列敘述何者錯誤？","opts":["循環信用利息及各項費用","每期應付之分期本金及利息","累計以前各期逾期未付最低應繳款項之總 efs":"41-44","stem":"銀行擬轉讓不良債權予資產管理公司，資產管理公司於符合一定條件範圍內，銀行可對資產管理公司提供該不良債權之資料，有關資產管理公司之條件及不良債權資料，下列敘述何者錯誤？","opts":["資產管理公司必須確保接觸資料者不會外洩債權資料","不得移轉之不良債權資料，其型態包括書面及電子檔案","資產管理公司必須確保接觸資料者不得有其他不當利用之行為","對銀行債務之履行無法律上義務者之資料，得提供與資產管理公司"],"ans":4,"exp":["💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","🔗 相關考點 L-131：有關銀行擬轉讓不良債權予資產管理公司，其所提供之資料須符合主管機關之條件規定，下列敘述何者… → 錯的是「資產管理公司若屬銀行以合資方式與他人共同成立者，則不須建立內部控制機制」","見筆記 法規 5｜委外作業與出售不良債權"]},{"id":"41法規-47","s":"law","ch":"法規 2｜信用卡、現金卡業務","star":0,"n":1,"refs":"41-47","stem":"依「信用卡業務機構管理辦法」規定，有關各發卡機構於核給信用卡信用額度時，下列敘述何者錯誤？","opts":["應確認申請人身分之真實性","應瞭解申請人舉債情形（包含各發卡機構所核發信用卡、消費性貸款之總額度與往來之狀況）","無須留存相關財力證明文件與徵信查核紀錄","應落實徵授信原則，審慎核給"],"ans":3,"exp":["💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","🔗 相關考點 L-028：依「信用卡業務機構管理辦法」規定，下列何者為發卡業務之一？… → 答案「辦理信用卡預借現金業務」","🔗 相關考點 L-040：有關發卡機構辦理信用卡業務，下列敘述何者錯誤？… → 錯的是「發卡機構對已核發之信用卡至少每年應定期辦理覆審」","見筆記 法規 2｜信用卡、現金卡業務"]},{"id":"41法規-49","s":"law","ch":"法規 1｜銀行業務相關規範","star":0,"n":1,"refs":"41-49","stem":"依主管機關規定，下列何者非屬銀行法第 32 條所稱之「消費者貸款」？","opts":["支付學費貸款","汽車貸款","信用卡循環信用","購置自住使用之房屋貸款"],"ans":4,"exp":["💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","🔗 相關考點 L-017：下列何者非屬銀行法第 32 條所稱消費者貸款之範圍？… → 錯的是「定期存款質借」","🔗 相關考點 L-013：銀行法第 32 條所稱之消費者貸款授信限額，其中每一消費者信用卡循環信用金額之計算，下列何… → 答案「以信用卡循環信用餘額計算，由銀行在不超過新臺幣一百萬元範圍內自行控管額度」","見筆記 法規 1｜銀行業務相關規範"]},{"id":"42法規-08","s":"law","ch":"法規 8｜內部控制及稽核制度","star":0,"n":1,"refs":"42-8","stem":"依「金融控股公司及銀行業內部控制及稽核制度實施辦法」規定，有關內部稽核人員基本資料之申報，下列敘述何者錯誤？","opts":["應於每年一月底前申報","應以網際網路資訊系統申報","申報前應檢查內部稽核人員資格條件及訓練時數是否符合規定","人員資格條件及訓練時數如有違反規定者應於一個月內改善"],"ans":4,"exp":["💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","🔗 相關考點 L-271：依「金融控股公司及銀行業內部控制及稽核制度實施辦法」規定，有關內部控制之目標，下列敘述何者… → 錯的是「達成預算盈餘目標」","🔗 相關考點 L-224：依「金融控股公司及銀行業內部控制及稽核制度實施辦法」規定，有關金融控股公司及銀行業內部稽核… → 錯的是「應設立隸屬總經理室之內部稽核單位」","見筆記 法規 8｜內部控制及稽核制度"]},{"id":"42法規-09","s":"law","ch":"法規 8｜內部控制及稽核制度","star":0,"n":1,"refs":"42-9","stem":"依「銀行業公司治理實務守則」規定，有關董事會之職能，下列敘述何者錯誤？","opts":["公開發行銀行業獨立董事人數不得少於二人，且不得少於董事席次五分之一","董事長及總經理不宜由同一人或互為配偶擔任","銀行業設置審計委員會者，審計委員會應由全體獨立董事組成，其人數不得少於三人","為保持獨立董事 證券業務"]},{"id":"35實務-47","s":"prac","ch":"實務 8｜信託業務","star":0,"n":1,"refs":"35-47","stem":"有關信託業督導、管理及業務人員之學識或經驗，下列敘述何者正確？","opts":["兼營信託業務之銀行，其董事及監察人至少各有二人具備信託專門學識或經驗","業務人員曾於最近一年內參加信託公會或其認可之機構舉辦之信託業務訓練課程，累計十八小時以上，持有結業證書","督導人員曾於最近一年內參加信託公會或其認可之機構舉辦之信託業高階主管研習課程累計三小時以上，持有結業證書","管理人員曾於信託公會或其認可之機構教授信託相關課程十八小時以上"],"ans":3,"exp":["💡 本題問「正確」：另外三個選項都是錯的，想想錯在哪裡","見筆記 實務 8｜信託業務"]},{"id":"35實務-58","s":"prac","ch":"實務 4｜徵信與授信","star":0,"n":1,"refs":"35-58","stem":"依票券商防制洗錢注意事項，下列何者非應注意及通報事項？","opts":["客戶要求將其超過一百萬元之買賣價款，匯付非本人帳戶","客戶意圖使用假名進行交易","時常與客戶往來且有大額資金轉出者","同一連絡人以不同客戶名稱為買賣交易，且未能說明其與本人之關係"],"ans":3,"exp":["💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","見筆記 實務 4｜徵信與授信"]},{"id":"35實務-59","s":"prac","ch":"實務 7｜票券與證券業務","star":0,"n":1,"refs":"35-59","stem":"下列何者為票券商業務人員得為之行為？","opts":["接受客戶委託買賣短期票券，同時以自己之計算為買入或賣出之相對行為","對客戶委託交易事項及職務上所知悉之秘密，未盡保密之責","未經客戶授權，以其名義辦理開戶、買賣或交割","依據客戶委託事項及條件，執行短期票券之買賣行為"],"ans":4,"exp":["見筆記 實務 7｜票券與證券業務"]},{"id":"35實務-63","s":"prac","ch":"實務 10｜消費金融業務","star":0,"n":1,"refs":"35-63","stem":"有關發卡機構風險控管人員接到授權單位人員通報，欲對持卡人之信用（現金）卡予以設控或解控之作法，下列敘述何者錯誤？","opts":["有非本人查詢餘額時，應立即設控","知悉持卡人死亡時，應立即設控","持卡人超額預借現金時，應立即設控","對被設控之卡片解控，免經授權單位確認，直接由風險控管人員決定"],"ans":4,"exp":["💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","見筆記 實務 10｜消費金融業務"]},{"id":"35實務-65","s":"prac","ch":"實務 5｜逾期放款催收與呆帳","star":0,"n":1,"refs":"35-65","stem":"有關消費金融產品之債權回收，下列敘述何者錯誤？","opts":["應注重催收績效，也應關心催收之品質","給付給委外公司之佣金應由專人確實覆核","委外催收可直接與受託機構簽訂契約，毋庸訂定作業辦法","與客戶簽定聲明書或切結書等文件，須由法務人員確認其適法性"],"ans":3,"exp":["💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","🔗 相關考點 P-239：有關消費金融產品之債權收回，下列敘述何者正確？… → 答案「給付委外廠商之佣金，應由專人確實覆核」","見筆記 實務 5｜逾期放款催收與呆帳"]},{"id":"35實務-69","s":"prac","ch":"實務 10｜消費金融業務","star":0,"n":1,"refs":"35-69","stem":"有關消費金融業務之帳戶管理，下列敘述何者錯誤？","opts":["借款人以具有行為能力者為原則","債權憑證應由指定之主管人員負責保管","若保證人於借據上簽名蓋章，則不須徵提約定書","嗣後有關授信往來之借（票）據及文件之簽章，均應與約定書留存簽章相符"],"ans":3,"exp":["💡 本題問「錯的／不屬於／有缺失」：另外三個選項都是正確做法或規定，一起記起來","🔗 相關考點 P-458：有關消費金融業務帳戶管理之內部控制，下列敘述何者錯誤？… → 錯的是「持卡人繳交款項，經輸入電腦銷帳後，應經原登錄人員覆核其銷帳內容」","🔗 相關考點 P-409：有關影響消費金融業務之因素，下列 const CFG = DATA.cfg, SUBS = CFG.order;
const KEY = CFG.key;
let S = null;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
S = Object.assign({rec: {}, wrong: {}, fav: {}, mock: {}, hist: [], cur: null,
                   prefs: {s: SUBS[0], star: 1, mode: 'all', shuf: false}}, S || {});
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const ITEMS = {}, ORDER = {};
let ordN = 0;
DATA.hot.forEach(q => { ITEMS[q.id] = q; ORDER[q.id] = ordN++; });
DATA.single.forEach(q => { ITEMS[q.id] = q; ORDER[q.id] = ordN++; });
DATA.mock.forEach(p => p.items.forEach(q => { if (!ITEMS[q.id]) { ITEMS[q.id] = q; ORDER[q.id] = ordN++; } }));
const POOL = {};
SUBS.forEach(s => { POOL[s] = []; });
DATA.hot.concat(DATA.single).forEach(q => { if (q.ans != null) POOL[q.s].push(q); });

function genRandom(s) {
  const ids = [];
  DATA.blocks[s].forEach(([ch, k]) => {
    const cand = POOL[s].filter(q => q.ch === ch)
      .map(q => ({q, key: Math.pow(Math.random(), 1 / (q.n || 1))}))
      .sort((a, b) => b.key - a.key).slice(0, k).map(x => x.q);
    shuffle(cand).forEach(q => ids.push(q.id));
  });
  return ids;
}

function paperFromCur(c) {
  if (c.ids) return {id: c.pid, name: c.name, min: c.min, items: c.ids.map(id => ITEMS[id])};
  return paperOf(c.pid);
}
const SUBJ = {}, SHORT = {};
SUBS.forEach(s => { SUBJ[s] = CFG.subj[s].name; SHORT[s] = CFG.subj[s].short; });
const CHS = s => DATA.blocks[s].map(b => b[0]);
const score100 = (right, n) => Math.round(right * 10000 / n) / 100;
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const paperOf = id => DATA.mock.find(p => p.id === id);
const isOk = (q, a) => q.ans == null || a === q.ans;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };

let view = 'home', tab = 'practice', sess = null, result = null, timerId = null;

function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

function record(q, n, fromWrong) {
  const ok = isOk(q, n);
  const r = S.rec[q.id] || {c: 0, w: 0};
  ok ? r.c++ : r.w++;
  r.last = ok ? 1 : 0;
  S.rec[q.id] = r;
  if (!ok) S.wrong[q.id] = 1; else if (fromWrong) delete S.wrong[q.id];
}

/* ---------- 首頁 ---------- */
function home() {
  view = 'home'; sess = null; stopTimer();
  const tabs = [['practice', '練習'], ['mock', '模擬考'], ['wrong', '錯題本'], ['stats', '紀錄']];
  let h = `<header><div class="hrow"><h1>${esc(CFG.title)}</h1><span class="links"><a href="note.html?v=1790687788">📖 筆記</a><a href="answers.html?v=1790687788">✅ 解析</a><a href="numbers.html?v=1790687788">🔢 數字</a></span></div><nav>${tabs.map(([k, v]) =>
    `<button class="tab ${tab === k ? 'on' : ''}" data-act="tab" data-arg="${k}">${v}</button>`).join('')}</nav></header><main>`;
  if (!['practice', 'mock', 'wrong', 'stats'].includes(tab)) tab = 'practice';
  h += {practice: practiceTab, mock: mockTab, wrong: wrongTab, stats: statsTab}[tab]();
  app.innerHTML = h + '</main>';
  const st = app.querySelector('[data-pref=star]'); if (st) st.value = S.prefs.star;
  const md = app.querySelector('[data-pref=mode]'); if (md) md.value = S.prefs.mode;
}

function hotList(s, ch) {
  const src = S.prefs.star === 0 ? DATA.hot.concat(DATA.single) : DATA.hot;
  return src.filter(q => q.s === s && (!ch || q.ch === ch) && q.star >= S.prefs.star && q.ans != null);
}

function practiceTab() {
  const p = S.prefs;
  const chs = CHS(p.s);
  let h = `<div class="card"><div class="seg">${SUBS.map(s =>
    `<button data-act="subj" data-arg="${s}" class="${p.s === s ? 'on' : ''}">${SUBJ[s]}</button>`).join('')}</div>
    <label>星等 <select data-pref="star"><option value="1">高頻題（考過 2 屆以上）</option><option value="2">⭐⭐ 以上</option><option value="3">⭐⭐⭐</option><option value="0">全部題目（含只考過 1 屆）</option></select></label>
    <label>題目 <select data-pref="mode"><option value="all">全部</option><option value="new">只做沒做過</option><option value="weak">沒做過＋上次錯</option></select></label>
    <label><input type="checkbox" data-pref="shuf" ${p.shuf ? 'checked' : ''}> 隨機順序</label>
    <div class="mut">⭐ 越多＝在歷屆考試出現越多次。點章節開始作答，選完立刻看對錯與解析。</div></div>`;
  [''].concat(chs).forEach(ch => {
    const L = hotList(p.s, ch);
    if (!L.length) return;
    const done = L.filter(q => S.rec[q.id]).length;
    const right = L.filter(q => S.rec[q.id] && S.rec[q.id].last).length;
    h += `<button class="row" data-act="start" data-arg="${esc(ch)}"><div class="rt"><b>${ch ? esc(ch) : '全部章節'}</b>
      <span>${L.length} 題 · 做過 ${done} · 上次答對 ${right}</span></div><div class="pbar"><i style="width:${done / L.length * 100}%"></i></div></button>`;
  });
  return h;
}

function mockTab() {
  let h = '';
  if (S.cur) {
    const p = paperFromCur(S.cur);
    h += `<div class="card warn"><b>有未完成的模擬考：${p.name}</b><br><span class="mut">剩餘 ${fmt(S.cur.end - Date.now())}</span><br>
      <button class="primary" data-act="resume">繼續作答</button><button data-act="abandon">放棄</button></div>`;
  }
  const need = SUBS.map(s => `${SHORT[s]}對 ${Math.ceil(CFG.subj[s].n * 0.7)} 題`).join('、');
  h += `<div class="card mut">限時作答、交卷才公布答案；70 分及格（${need}）。中途離開會保留進度，但時間照走。答錯與未作答的題目會自動加入錯題本。</div>`;
  const rm = k => S.mock[k] ? ` · 最高 ${S.mock[k].best} 分 · 做過 ${S.mock[k].times} 次` : '';
  h += `<div class="card"><b>🎲 隨機模擬考（每次都是新考卷）</b>
    <div class="mut">從${esc(CFG.range)}全部題目抽題：每章題數照正式考試配置；出現越多屆的題目越容易被抽到（出現 6 屆＝機率 6 倍）；同一份考卷不重複。</div>
    ${SUBS.map(s => `<button class="primary" data-act="rstart" data-arg="${s}">${SHORT[s]}（${CFG.subj[s].n} 題 ${CFG.subj[s].min} 分鐘）</button>`).join('')}
    <div class="mut">${SUBS.filter(s => rm('rand-' + s)).map(s => SHORT[s] + rm('rand-' + s)).join('<br>')}</div></div>
    <div class="mut" style="margin:4px 2px 8px">歷屆原卷</div>`;
  DATA.mock.forEach(p => {
    const m = S.mock[p.id];
    h += `<button class="row" data-act="mstart" data-arg="${p.id}"><div class="rt"><b>${p.name}</b>
      <span>限時 ${p.min} 分鐘${m ? ` · 最高 ${m.best} 分 · 做過 ${m.times} 次` : ''}</span></div></button>`;
  });
  return h;
}

function wrongIds(kind) {
  const src = kind === 'fav' ? S.fav : S.wrong;
  return Object.keys(src).filter(id => ITEMS[id] && (kind === 'all' || kind === 'fav' || ITEMS[id].s === kind))
    .sort((a, b) => ORDER[a] - ORDER[b]);
}

function wrongTab() {
  const rows = [['all', '全部錯題']].concat(SUBS.map(s => [s, SHORT[s] + '錯題']), [['fav', '★ 收藏題']]);
  let h = '<div class="card mut">練習或模擬考答錯的題目會自動收進來；在這裡<b>答對就移出</b>。作答時點右上角 ☆ 可收藏。</div>';
  rows.forEach(([k, v]) => {
    const n = wrongIds(k).length;
    h += `<button class="row" data-act="wstart" data-arg="${k}" ${n ? '' : 'disabled'}><div class="rt"><b>${v}</b><span>${n} 題</span></div></button>`;
  });
  return h;
}

function statsTab() {
  let h = '';
  SUBS.forEach(s => {
    const all = DATA.hot.filter(q => q.s === s);
    const done = all.filter(q => S.rec[q.id]);
    const right = done.filter(q => S.rec[q.id].last).length;
    h += `<div class="card"><b>${SUBJ[s]}（高頻題）</b><div class="mut">做過 ${done.length} / ${all.length} 題；上次答對 ${right} 題${done.length ? `（${Math.round(right / done.length * 100)}%）` : ''}</div>
      <table><tr><th>章節</th><th>做過</th><th>上次答對率</th></tr>`;
    CHS(s).forEach(ch => {
      const L = all.filter(q => q.ch === ch), d = L.filter(q => S.rec[q.id]), r = d.filter(q => S.rec[q.id].last).length;
      if (!L.length) return;
      h += `<tr><td>${esc(ch)}</td><td>${d.length}/${L.length}</td><td>${d.length ? Math.round(r / d.length * 100) + '%' : '—'}</td></tr>`;
    });
    h += '</table></div>';
  });
  h += '<div class="card"><b>模擬考紀錄</b>';
  h += S.hist.length ? '<table><tr><th>時間</th><th>考卷</th><th>分數</th><th>用時</th></tr>' + S.hist.slice(0, 20).map(x =>
    `<tr><td>${esc(x.date)}</td><td>${esc(x.name)}</td><td class="${x.score >= 70 ? 'pass' : 'fail'}">${x.score}</td><td>${x.used} 分</td></tr>`).join('') + '</table>'
    : '<div class="mut">還沒考過</div>';
  h += '</div><div class="card mut">紀錄存在這台裝置的瀏覽器裡（手機、電腦各自分開）。<br><button data-act="reset">清除所有紀錄</button></div>';
  return h;
}

/* ---------- 題目卡 ---------- */
function qCard(q, a, reveal, label) {
  const meta = label || (q.ch ? `${q.id}　${q.star ? '⭐'.repeat(q.star) + '　' : ''}出現 ${q.n} 屆　${esc(q.ch)}` : q.id);
  let h = `<div class="card"><div class="meta">${meta}</div><div class="stem">${esc(q.stem)}</div><div class="opts">`;
  const shown = reveal && a !== undefined;
  q.opts.forEach((o, k) => {
    const n = k + 1;
    let c = '';
    if (shown) { if (q.ans == null || n === q.ans) c = 'ok'; else if (n === a) c = 'bad'; }
    else if (a === n) c = 'sel';
    h += `<button class="opt ${c}" data-act="pick" data-arg="${n}" ${shown ? 'disabled' : ''}><b>(${n})</b> ${esc(o)}</button>`;
  });
  h += '</div>';
  if (shown) {
    const ok = a !== 0 && isOk(q, a);
    const tag = a === 0 ? '— 未作答' : ok ? '✔ 答對' : '✘ 答錯';
    h += `<div class="exp ${ok ? 'ok' : 'bad'}" id="exp"><div class="res">${tag}　正解 ${q.ans ? `(${q.ans}) ${esc(q.opts[q.ans - 1])}` : '送分題（任何答案都算對）'}</div>
      ${q.exp.map(e => `<p>${esc(e)}</p>`).join('')}${q.refs ? `<p class="refs">歷屆出處：${esc(q.refs)}</p>` : ''}</div>`;
  }
  return h + '</div>';
}

/* ---------- 練習 ---------- */
function startSession(list, title, kind) {
  if (!list.length) { alert('這個條件下沒有題目'); return; }
  if (S.prefs.shuf) list = shuffle([...list]);
  sess = {list, i: 0, ans: {}, title, kind};
  view = 'sess'; showQ(true);
}

function showQ(top) {
  const q = sess.list[sess.i], a = sess.ans[q.id];
  app.innerHTML = `<header class="bar"><button data-act="home">← 返回</button><span>${esc(sess.title)}<br>${sess.i + 1} / ${sess.list.length}</span>
    <button class="fav" data-act="fav">${S.fav[q.id] ? '★' : '☆'}</button></header><main>${qCard(q, a, true)}
    <div class="nav"><button data-act="prev" ${sess.i === 0 ? 'disabled' : ''}>上一題</button>
    <button class="primary" data-act="next">${sess.i === sess.list.length - 1 ? '看結果' : '下一題'}</button></div></main>`;
  if (top) window.scrollTo(0, 0);
  else { const e = document.getElementById('exp'); if (e) e.scrollIntoView({behavior: 'smooth', block: 'nearest'}); }
}

function summary() {
  view = 'summary';
  const L = sess.list, done = L.filter(q => sess.ans[q.id] != null);
  const wrongs = done.filter(q => !isOk(q, sess.ans[q.id]));
  const right = done.length - wrongs.length;
  sess.wrongs = wrongs;
  app.innerHTML = `<header class="bar"><button data-act="home">← 返回</button><span>${esc(sess.title)}</span><span></span></header><main>
    <div class="card center"><div class="big">${right} / ${done.length}</div>
    <p>答對率 ${done.length ? Math.round(right / done.length * 100) : 0}%（共 ${L.length} 題，作答 ${done.length} 題）</p>
    ${wrongs.length ? `<button class="primary" data-act="redo">重做這次答錯的 ${wrongs.length} 題</button>` : ''}
    <button data-act="home">回首頁</button></div></main>`;
  window.scrollTo(0, 0);
}

/* ---------- 模擬考 ---------- */
function showMock() {
  view = 'mock';
  const c = S.cur, p = paperFromCur(c), q = p.items[c.i];
  const n = Object.keys(c.ans).length;
  app.innerHTML = `<header class="bar"><button data-act="home">← 暫離</button><span>⏱ <b id="timer"></b><br>${c.i + 1} / ${p.items.length}（已答 ${n}）</span>
    <button class="primary" data-act="submit">交卷</button></header><main>${qCard(q, c.ans[q.id], false, `${p.name}　第 ${c.i + 1} 題`)}
    <div class="nav"><button data-act="prev" ${c.i === 0 ? 'disabled' : ''}>上一題</button><button data-act="next" ${c.i === p.items.length - 1 ? 'disabled' : ''}>下一題</button></div>
    <div class="card"><div class="mut">題目總覽（藍色＝已作答）</div><div class="grid">${p.items.map((x, k) =>
      `<button class="${c.ans[x.id] ? 'done' : ''} ${k === c.i ? 'cur' : ''}" data-act="mgo" data-arg="${k}">${k + 1}</button>`).join('')}</div></div></main>`;
  tick();
  if (!timerId) timerId = setInterval(tick, 1000);
}

function tick() {
  if (!S.cur) return stopTimer();
  const left = S.cur.end - Date.now();
  if (left <= 0) { stopTimer(); alert('時間到，自動交卷'); submitMock(); return; }
  const el = document.getElementById('timer');
  if (el) el.textContent = fmt(left);
}

function submitMock() {
  stopTimer();
  const c = S.cur, p = paperFromCur(c);
  let right = 0;
  p.items.forEach(q => {
    const a = c.ans[q.id];
    if (a != null) record(q, a, false);
    else if (q.ans != null) S.wrong[q.id] = 1;
    if (a != null ? isOk(q, a) : q.ans == null) right++;
  });
  const score = score100(right, p.items.length);
  const m = S.mock[p.id] || {best: 0, times: 0};
  m.best = Math.max(m.best, score); m.times++;
  S.mock[p.id] = m;
  const used = Math.round((Math.min(Date.now(), c.end) - c.start) / 60000);
  S.hist.unshift({pid: p.id, name: p.name, score, used, date: new Date().toLocaleString('zh-TW', {hour12: false})});
  result = {p, ans: {...c.ans}, score, right, used, i: 0};
  S.cur = null; save();
  showResult();
}

function showResult() {
  view = 'result';
  const r = result;
  app.innerHTML = `<header class="bar"><button data-act="home">← 首頁</button><span>${r.p.name}</span><span></span></header><main>
    <div class="card center"><div class="big">${r.score} 分</div>
    <p class="${r.score >= 70 ? 'pass' : 'fail'}">${r.score >= 70 ? '及格 🎉' : '未達 70 分'}　答對 ${r.right} / ${r.p.items.length}　用時 ${r.used} 分鐘</p></div>
    <div class="card"><div class="mut">點題號看解析（綠＝對、紅＝錯或未答）</div><div class="grid">${r.p.items.map((q, k) => {
      const a = r.ans[q.id]; const ok = a != null ? isOk(q, a) : q.ans == null;
      return `<button class="${ok ? 'ok' : 'bad'}" data-act="rgo" data-arg="${k}">${k + 1}</button>`; }).join('')}</div>
    <button class="primary" data-act="rwrong" style="margin-top:10px">只看錯題解析</button></div></main>`;
  window.scrollTo(0, 0);
}

function showReview() {
  view = 'review';
  const r = result, list = r.list, q = list[r.i];
  app.innerHTML = `<header class="bar"><button data-act="result">← 成績</button><span>${r.p.name}<br>檢討 ${r.i + 1} / ${list.length}</span><button class="fav" data-act="fav">${S.fav[q.id] ? '★' : '☆'}</button></header>
    <main>${qCard(q, r.ans[q.id] || 0, true)}<div class="nav"><button data-act="prev" ${r.i === 0 ? 'disabled' : ''}>上一題</button>
    <button data-act="next" ${r.i === list.length - 1 ? 'disabled' : ''}>下一題</button></div></main>`;
  window.scrollTo(0, 0);
}

/* ---------- 事件 ---------- */
function curQ() {
  if (view === 'sess') return sess.list[sess.i];
  if (view === 'review') return result.list[result.i];
  if (view === 'mock') return paperFromCur(S.cur).items[S.cur.i];
}

function act(a, arg) {
  switch (a) {
    case 'tab': tab = arg; home(); break;
    case 'home': home(); break;
    case 'subj': S.prefs.s = arg; save(); home(); break;
    case 'start': startSession(hotList(S.prefs.s, arg).filter(q => S.prefs.mode === 'all' ? true :
        S.prefs.mode === 'new' ? !S.rec[q.id] : !S.rec[q.id] || !S.rec[q.id].last), arg || `${SHORT[S.prefs.s]}｜全部章節`, 'hot'); break;
    case 'wstart': startSession(wrongIds(arg).map(id => ITEMS[id]), arg === 'fav' ? '收藏題' : '錯題本', arg === 'fav' ? 'fav' : 'wrong'); break;
    case 'redo': startSession(sess.wrongs, '重做錯題', sess.kind); break;
    case 'fav': { const q = curQ(); if (S.fav[q.id]) delete S.fav[q.id]; else S.fav[q.id] = 1; save();
      view === 'review' ? showReview() : showQ(false); break; }
    case 'pick': {
      const n = +arg;
      if (view === 'sess') { const q = sess.list[sess.i]; if (sess.ans[q.id] != null) return;
        sess.ans[q.id] = n; record(q, n, sess.kind === 'wrong'); save(); showQ(false); }
      else if (view === 'mock') { const q = curQ(); S.cur.ans[q.id] = n; save(); showMock(); }
      break; }
    case 'prev':
      if (view === 'sess' && sess.i > 0) { sess.i--; showQ(true); }
      else if (view === 'mock' && S.cur.i > 0) { S.cur.i--; save(); showMock(); }
      else if (view === 'review' && result.i > 0) { result.i--; showReview(); }
      break;
    case 'next':
      if (view === 'sess') { if (sess.i < sess.list.length - 1) { sess.i++; showQ(true); } else summary(); }
      else if (view === 'mock' && S.cur.i < paperFromCur(S.cur).items.length - 1) { S.cur.i++; save(); showMock(); }
      else if (view === 'review' && result.i < result.list.length - 1) { result.i++; showReview(); }
      break;
    case 'mstart': {
      if (S.cur && !confirm('會放棄目前未完成的模擬考，確定開始新的一份？')) return;
      const p = paperOf(arg);
      if (!confirm(`${p.name}\n限時 ${p.min} 分鐘，按確定開始計時。`)) return;
      S.cur = {pid: p.id, ans: {}, i: 0, start: Date.now(), end: Date.now() + p.min * 60000}; save(); showMock(); break; }
    case 'rstart': {
      if (S.cur && !confirm('會放棄目前未完成的模擬考，確定開始新的一份？')) return;
      const min = CFG.subj[arg].min, name = `隨機模擬考 ${SHORT[arg]}`;
      if (!confirm(`${name}\n限時 ${min} 分鐘，按確定開始計時。`)) return;
      S.cur = {pid: `rand-${arg}`, ids: genRandom(arg), name, min, ans: {}, i: 0, start: Date.now(), end: Date.now() + min * 60000};
      save(); showMock(); break; }
    case 'resume': if (S.cur.end <= Date.now()) { alert('時間已到，自動交卷'); submitMock(); } else showMock(); break;
    case 'abandon': if (confirm('確定放棄這份模擬考？作答不會計分。')) { S.cur = null; save(); home(); } break;
    case 'mgo': S.cur.i = +arg; save(); showMock(); break;
    case 'submit': {
      const left = paperFromCur(S.cur).items.length - Object.keys(S.cur.ans).length;
      if (confirm(left ? `還有 ${left} 題沒作答，確定交卷？` : '確定交卷？')) submitMock(); break; }
    case 'result': showResult(); break;
    case 'rgo': result.list = result.p.items; result.i = +arg; showReview(); break;
    case 'rwrong': {
      result.list = result.p.items.filter(q => { const a = result.ans[q.id]; return !(a != null ? isOk(q, a) : q.ans == null); });
      if (!result.list.length) { alert('全對，沒有錯題！'); return; }
      result.i = 0; showReview(); break; }
    case 'reset': if (confirm('確定清除所有作答紀錄、錯題本、收藏與模擬考成績？')) {
      S = {rec: {}, wrong: {}, fav: {}, mock: {}, hist: [], cur: null, prefs: S.prefs}; save(); home(); } break;
  }
}

app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && !b.disabled) act(b.dataset.act, b.dataset.arg);
});
app.addEventListener('change', e => {
  const k = e.target.dataset.pref;
  if (!k) return;
  S.prefs[k] = k === 'shuf' ? e.target.checked : k === 'star' ? +e.target.value : e.target.value;
  save(); home();
});
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (/^[1-4]$/.test(e.key) && (view === 'sess' || view === 'mock')) act('pick', e.key);
  else if (e.key === 'ArrowRight' || (e.key === 'Enter' && view !== 'home')) act('next');
  else if (e.key === 'ArrowLeft') act('prev');
});

home();
</script>
